services:
  broker:
    build: ./broker

  proxy:
    build: ./proxy

  servidor_1:
    build: ./servidor
    environment:
      - SERVER_NAME=servidor_1
    volumes:
      - ./dados:/dados
    depends_on:
      - broker
      - proxy

  servidor_2:
    build: ./servidor
    environment:
      - SERVER_NAME=servidor_2
    volumes:
      - ./dados:/dados
    depends_on:
      - broker
      - proxy

  bot_1:
    build: ./cliente
    environment:
      - BOT_NAME=bot_1
    depends_on:
      - broker
      - proxy
      - servidor_1
      - servidor_2

  bot_2:
    build: ./cliente
    environment:
      - BOT_NAME=bot_2
    depends_on:
      - broker
      - proxy
      - servidor_1
      - servidor_2
